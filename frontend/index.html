<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ingresar | Gestión de turnos</title>
    <link rel="stylesheet" href="css/estilos.css">
    <script src="js/api.js" defer></script>
    <script src="js/app.js" defer></script>
</head>
<body class="login-page">
    <main class="login-card">
        <span class="marca">GT / GESTIÓN DE TURNOS</span>
        <h1>Bienvenido</h1>
        <p class="subtitulo">Ingresá con tu cuenta (Administrador, Médico o Paciente) para gestionar los turnos.</p>
        <form id="login-form">
            <label for="email">Correo electrónico</label>
            <input id="email" name="email" type="email" autocomplete="username" placeholder="nombre@ejemplo.com" required>
            <label for="password">Contraseña</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required>
            <p id="login-error" class="mensaje error" role="alert"></p>
            <button id="login-boton" type="submit">Iniciar sesión</button>
        </form>
        <p class="nota">Perfiles habilitados: Administrador · Médico · Paciente</p>
    </main>
</body>
</html>
